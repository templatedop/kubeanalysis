apiVersion: v2
name: kubeanalysis
description: Kubernetes cluster analysis with RAG and Temporal workflows
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - kubernetes
  - analysis
  - security
  - performance
  - rag
  - temporal
  - llm
maintainers:
  - name: KubeAnalysis Team
    email: team@kubeanalysis.io
home: https://github.com/kubeanalysis/kubeanalysis
sources:
  - https://github.com/kubeanalysis/kubeanalysis
dependencies:
  - name: postgresql
    version: "13.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: temporal
    version: "0.x.x"
    repository: https://go.temporal.io/helm-charts
    condition: temporal.enabled
