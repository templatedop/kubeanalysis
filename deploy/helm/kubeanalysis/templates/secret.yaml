{{- if or .Values.secrets.llmApiKey .Values.secrets.embedderApiKey (eq .Values.vectorStore.type "postgres") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeanalysis.fullname" . }}
  labels:
    {{- include "kubeanalysis.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.llmApiKey }}
  llm-api-key: {{ .Values.secrets.llmApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.embedderApiKey }}
  embedder-api-key: {{ .Values.secrets.embedderApiKey | b64enc | quote }}
  {{- end }}
  {{- if eq .Values.vectorStore.type "postgres" }}
  postgres-url: {{ include "kubeanalysis.postgresURL" . | b64enc | quote }}
  {{- end }}
{{- end }}
