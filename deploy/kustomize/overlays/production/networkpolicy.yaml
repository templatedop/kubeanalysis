apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeanalysis
  namespace: kubeanalysis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubeanalysis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controllers
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow Kubernetes API
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Allow Temporal
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 7233
    # Allow Ollama/LLM
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 11434
    # Allow PostgreSQL
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
