apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubeanalysis

namePrefix: prod-

commonLabels:
  app.kubernetes.io/environment: production

resources:
  - ../../base
  - servicemonitor.yaml
  - networkpolicy.yaml

patches:
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml

images:
  - name: kubeanalysis/kubeanalysis
    newTag: latest
