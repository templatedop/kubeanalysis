apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubeanalysis-dev

namePrefix: dev-

commonLabels:
  app.kubernetes.io/environment: dev

resources:
  - ../../base

patches:
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml

configMapGenerator:
  - name: kubeanalysis-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
