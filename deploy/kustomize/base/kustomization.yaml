apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: kubeanalysis

commonLabels:
  app.kubernetes.io/name: kubeanalysis
  app.kubernetes.io/component: analyzer

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

configMapGenerator:
  - name: kubeanalysis-config
    behavior: merge
    files:
      - config.yaml
